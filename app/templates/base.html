<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; }
        nav { background: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1rem; }
        nav .brand { font-weight: bold; font-size: 1.2rem; color: white; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .flash { background: #f0ad4e; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button, .btn { background: #2c3e50; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        button:hover, .btn:hover { background: #3d5166; }
        label { font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('main.dashboard') }}" class="brand">🎫 TicketFlow</a>
        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('tickets.new_ticket') }}" style="color:white;">+ New Ticket</a>
                <span style="color:#aaa; margin: 0 0.5rem;">|</span>
                <span style="color:white;">{{ current_user.username }}</span>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                <a href="{{ url_for('auth.register') }}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% for message in get_flashed_messages() %}
            <div class="flash">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
